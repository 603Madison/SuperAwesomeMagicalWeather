# The iPhone app's Xcode project, generated with XcodeGen (`xcodegen` in this
# folder). The screens and everything behind them are the shared Kotlin code
# in :shared, built into Shared.framework by the "Kotlin" build phase.
name: SuperAwesomeMagicalWeather
options:
  bundleIdPrefix: app.northvane
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "29"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  SuperAwesomeMagicalWeather:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SuperAwesomeMagicalWeather
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # Compose renders at the display's full refresh rate.
        CADisableMinimumFrameDurationOnPhone: true
        NSLocationWhenInUseUsageDescription: Your location is used to show the weather where you are. It stays on your phone and goes only to the weather services, rounded.
        NSLocalNetworkUsageDescription: To reach your own weather station or AI server on your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.northvane.weather.refresh]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.app.northvane.weather]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.northvane.weather
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared]
    preBuildScripts:
      - name: Kotlin
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew --no-daemon :shared:embedAndSignAppleFrameworkForXcode
    dependencies:
      - target: WeatherWidget
        embed: true
  WeatherWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Weather
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.app.northvane.weather]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.northvane.weather.widget
        SKIP_INSTALL: YES
schemes:
  SuperAwesomeMagicalWeather:
    build:
      targets:
        SuperAwesomeMagicalWeather: all
        WeatherWidget: all
