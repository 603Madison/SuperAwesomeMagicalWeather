name: Release

# Builds the signed APK and publishes it as a GitHub release, with notes from the
# matching CHANGELOG.md section. Start it from the Actions tab ("Run workflow")
# with the version, or push a v* tag. The tag is created on the built commit if
# it doesn't exist yet, so nobody needs to push tags.
# Signing uses repository secrets (see docs/RELEASING.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.4.3 (must match versionName in app/build.gradle.kts)
        required: true
      commit:
        description: Commit or tag to build (defaults to the selected branch's latest commit, or the tag if it exists)
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}

env:
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.pick.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Don't leave the write token in .git/config, where the Gradle build (and its plugins) could read it.
          persist-credentials: false

      # An existing tag is rebuilt as tagged; otherwise the chosen commit (or branch tip).
      # Inputs reach the script only through env and are checked before use, so a
      # crafted version or commit can't run commands.
      - name: Pick commit and check version
        id: pick
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3 (or v1.2.3-beta.1)"
            exit 1
          fi
          if [ -n "$INPUT_COMMIT" ]; then
            if ! [[ "$INPUT_COMMIT" =~ ^([0-9a-f]{7,40}|v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
              echo "::error::Commit must be a commit hash or a v1.2.3 tag"
              exit 1
            fi
            # An existing release is only ever rebuilt from its own tag.
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null &&
              [ "$(git rev-parse "$INPUT_COMMIT^{commit}" 2>/dev/null)" != "$(git rev-parse "refs/tags/$TAG^{commit}")" ]; then
              echo "::error::$TAG already exists at another commit; leave Commit empty to rebuild it as tagged"
              exit 1
            fi
            REF="$INPUT_COMMIT"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            REF="refs/tags/$TAG"
          else
            REF="$EVENT_SHA"
          fi
          git checkout -q --detach "$REF" --
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$VERSION_NAME" != "$TAG" ]; then
            echo "::error::$TAG doesn't match versionName $VERSION_NAME in app/build.gradle.kts"
            exit 1
          fi
          # F-Droid shows the changelog for each version code from the fastlane folders.
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          for dir in fastlane mini/fastlane wear/fastlane; do
            if [ -d "$dir" ] && [ ! -s "$dir/metadata/android/en-US/changelogs/$VERSION_CODE.txt" ]; then
              echo "::error::Add $dir/metadata/android/en-US/changelogs/$VERSION_CODE.txt (the F-Droid changelog)"
              exit 1
            fi
          done
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android SDK platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run tests
        run: |
          # The Wear OS app only exists from 2.3.0 on; older releases are rebuilt without it.
          WEAR_TASKS=$([ -d wear ] && echo ":wear:testDebugUnitTest :wear:lintDebug" || true)
          ./gradlew --no-daemon :core:jvmTest :app:testDebugUnitTest :app:lintDebug :mini:testDebugUnitTest :mini:lintDebug $WEAR_TASKS

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'northvane' }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] && echo "RELEASE_KEYSTORE_BASE64: found" || echo "RELEASE_KEYSTORE_BASE64: missing"
          [ -n "$KEYSTORE_PASSWORD" ] && echo "RELEASE_KEYSTORE_PASSWORD: found" || echo "RELEASE_KEYSTORE_PASSWORD: missing"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD under Settings > Secrets and variables > Actions > Repository secrets (not Environment, Dependabot or Codespaces secrets)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore couldn't be opened: check that RELEASE_KEYSTORE_BASE64 was pasted completely and the password matches"
            exit 1
          fi
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :mini:assembleRelease $([ -d wear ] && echo :wear:assembleRelease || true)
          cp app/build/outputs/apk/release/app-release.apk "SuperAwesomeMagicalWeather-${TAG}.apk"
          # The Mini app (flip phones) only exists from 1.6.0 on; when it's in the source, its APK must be too.
          if [ -d mini ]; then
            cp mini/build/outputs/apk/release/mini-release.apk "SuperAwesomeMagicalWeather-Mini-${TAG}.apk"
          fi
          # Likewise the Wear OS app, from 2.3.0 on.
          if [ -d wear ]; then
            cp wear/build/outputs/apk/release/wear-release.apk "SuperAwesomeMagicalWeather-Wear-${TAG}.apk"
          fi
          # Every APK must carry the one release certificate, or installed copies couldn't update.
          EXPECTED=$(git show "$EVENT_SHA:.github/release-certificate.sha256" | tr -d ' \n')
          for apk in SuperAwesomeMagicalWeather-*.apk; do
            if ! "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | grep -qi "SHA-256 digest: $EXPECTED"; then
              echo "::error::$apk isn't signed with the release certificate ($EXPECTED)"
              exit 1
            fi
          done
          sha256sum SuperAwesomeMagicalWeather-*.apk | tee SHA256SUMS.txt

      - name: Release notes
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          # Notes come from the latest branch so older releases can be (re)published too.
          git show "$EVENT_SHA:CHANGELOG.md" | awk -v tag="${TAG#v}" '
            $0 ~ "^## \\[" tag "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md." > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Replace the files; drop debug-signed APKs left from before signing was set up.
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -- '-debug\.apk$' \
              | while read -r old; do gh release delete-asset "$TAG" "$old" --yes; done
            gh release upload "$TAG" SuperAwesomeMagicalWeather-*.apk SHA256SUMS.txt --clobber
          else
            # Only the highest version is marked Latest, whatever order releases are made in.
            newest=$( (git tag -l 'v*'; echo "$TAG") | grep -v -- '-' | sort -V | tail -n 1)
            gh release create "$TAG" SuperAwesomeMagicalWeather-*.apk SHA256SUMS.txt --target "$COMMIT" \
              --title "SuperAwesomeMagicalWeather ${TAG}" --notes-file release-notes.md \
              --latest=$([ "$TAG" = "$newest" ] && echo true || echo false) \
              $(echo "$TAG" | grep -q -- '-' && echo --prerelease)
          fi

  # The iPhone app from the same commit, as an unsigned .ipa (see docs/IOS.md).
  ios:
    needs: release
    uses: ./.github/workflows/ios.yml
    with:
      ref: ${{ needs.release.outputs.commit }}
      version: ${{ inputs.version || github.ref_name }}

  ios-publish:
    needs: [release, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-ipa
      - name: Attach the .ipa to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls SuperAwesomeMagicalWeather-*.ipa
          # Add its checksum to the release's list next to the APKs'.
          gh release download "$TAG" --pattern SHA256SUMS.txt --clobber
          grep -v '\.ipa$' SHA256SUMS.txt > sums.txt || true
          sha256sum SuperAwesomeMagicalWeather-*.ipa >> sums.txt
          mv sums.txt SHA256SUMS.txt
          gh release upload "$TAG" SuperAwesomeMagicalWeather-*.ipa SHA256SUMS.txt --clobber

  # Updates the F-Droid repository on GitHub Pages with the new release.
  fdroid-repo:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/fdroid-repo.yml
    # Only what it needs, not every repository secret.
    secrets:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
