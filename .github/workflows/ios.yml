name: iOS

# Builds the iPhone app on a Mac runner and keeps an unsigned .ipa as an
# artifact. Install it with Sideloadly or AltStore, which sign it with your
# own Apple ID (see docs/IOS.md). The release workflow calls this and attaches
# the .ipa to the GitHub release.
on:
  push:
    branches: [main, ios]
    paths:
      - "core/**"
      - "ui/**"
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true
      version:
        description: Release tag, e.g. v2.2.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Pick Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Android SDK platform (the Gradle build configures the Android modules too)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # One version for both platforms: Android's versionName and versionCode.
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ -n "$INPUT_VERSION" ] && [ "v$VERSION_NAME" != "$INPUT_VERSION" ]; then
            echo "::error::$INPUT_VERSION doesn't match versionName $VERSION_NAME"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          xcodebuild -project iosApp/SuperAwesomeMagicalWeather.xcodeproj -scheme SuperAwesomeMagicalWeather \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 || {
              grep -nE 'error:|^e: |What went wrong' -A3 xcodebuild.log | head -80
              exit 1
            }
          grep -E '\*\* BUILD' xcodebuild.log

      - name: Package the .ipa
        run: |
          APP=build/ios/Build/Products/Release-iphoneos/SuperAwesomeMagicalWeather.app
          # Ad-hoc signatures carry the entitlements (the App Group the widget reads from);
          # Sideloadly or AltStore replace them with your own when installing.
          codesign --force --sign - --entitlements iosApp/Widget/Widget.entitlements "$APP/PlugIns/WeatherWidget.appex"
          codesign --force --sign - --entitlements iosApp/App/App.entitlements "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../SuperAwesomeMagicalWeather-v${VERSION_NAME}.ipa" Payload)
          ls -la SuperAwesomeMagicalWeather-*.ipa
          shasum -a 256 SuperAwesomeMagicalWeather-*.ipa

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ipa
          path: SuperAwesomeMagicalWeather-*.ipa
          if-no-files-found: error

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

  # Not for releases: launches the app in the iPhone simulator and keeps screenshots, so a crash at
  # start or a blank screen shows up before anyone installs the .ipa.
  simulator:
    if: ${{ !inputs.ref }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Pick Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build for the simulator
        run: |
          brew install xcodegen
          (cd iosApp && xcodegen generate)
          xcodebuild -project iosApp/SuperAwesomeMagicalWeather.xcodeproj -scheme SuperAwesomeMagicalWeather \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO build > xcodebuild-sim.log 2>&1 || {
              grep -nE 'error:|^e: |What went wrong' -A3 xcodebuild-sim.log | head -80
              exit 1
            }

      - name: Launch and take screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in ios for d in devices[r] if d["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/SuperAwesomeMagicalWeather.app
          xcrun simctl launch --console-pty "$UDID" app.northvane.weather > app-console.log 2>&1 &
          mkdir -p shots
          for i in 1 2 3; do
            sleep 15
            xcrun simctl io "$UDID" screenshot "shots/launch-$i.png"
          done
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q app.northvane.weather; then
            echo "::error::The app isn't running after launch"
            tail -n 80 app-console.log
            find ~/Library/Logs/DiagnosticReports -name '*SuperAwesome*' -exec head -n 120 {} \; 2>/dev/null
            exit 1
          fi
          tail -n 40 app-console.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: simulator
          path: |
            shots/
            app-console.log
            xcodebuild-sim.log
          if-no-files-found: ignore
