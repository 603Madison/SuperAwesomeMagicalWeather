name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android SDK platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Unit tests, screenshot tests, lint, debug build
        run: ./gradlew --no-daemon :core:jvmTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :mini:testDebugUnitTest :mini:lintDebug :mini:assembleDebug :wear:testDebugUnitTest :wear:lintDebug :wear:assembleDebug :desktop:compileKotlinJvm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-and-screenshots
          path: |
            app/build/outputs/screenshots/
            mini/build/outputs/screenshots/
            wear/build/outputs/screenshots/
            app/build/reports/lint-results-debug.html
            mini/build/reports/lint-results-debug.html
            wear/build/reports/lint-results-debug.html
            core/build/reports/tests/
            app/build/reports/tests/
            mini/build/reports/tests/
            wear/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: superawesomemagicalweather-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            mini/build/outputs/apk/debug/mini-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk

  live-services:
    # Weekly check that NWS / NOAA / IEM still behave the way the app expects.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon :core:jvmTest -Pnorthvane.live=true
