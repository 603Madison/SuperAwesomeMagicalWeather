name: F-Droid repository

# Publishes an F-Droid repository on GitHub Pages from the newest GitHub
# releases, so the apps can be added in the F-Droid app. Runs after every
# release (called from release.yml) or by hand from the Actions tab.
# One-time setup: Settings > Pages > Source: GitHub Actions. See docs/FDROID.md.
on:
  workflow_call:
    secrets:
      RELEASE_KEYSTORE_BASE64:
        required: true
      RELEASE_KEYSTORE_PASSWORD:
        required: true
      RELEASE_KEY_ALIAS:
        required: false
      RELEASE_KEY_PASSWORD:
        required: false
  workflow_dispatch:

# Only the deploy job gets Pages permissions; the build job, which holds the signing key, can only read.
permissions:
  contents: read

concurrency:
  group: fdroid-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install fdroidserver and Android build tools
        run: |
          # Every package pinned with its hash (fdroid/requirements.txt, made with pip-compile
          # --generate-hashes): this job holds the signing key, so nothing unreviewed gets installed.
          pip install --quiet --require-hashes --no-deps -r fdroid/requirements.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" > /dev/null
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Download APKs from the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fdroid/repo
          gh release list --exclude-pre-releases --exclude-drafts --limit 3 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              gh release download "$tag" --pattern '*.apk' --dir fdroid/repo
            done
          rm -f fdroid/repo/*-debug.apk
          ls -l fdroid/repo
          [ -n "$(ls fdroid/repo/*.apk 2>/dev/null)" ] || { echo "::error::No release APKs found"; exit 1; }

      - name: Store listings and repo icon
        run: |
          for app in app.northvane.weather:fastlane app.northvane.mini:mini/fastlane; do
            id=${app%%:*}; src=${app#*:}
            mkdir -p "fdroid/metadata/$id"
            cp -r "$src/metadata/android/en-US" "fdroid/metadata/$id/"
          done
          cp fastlane/metadata/android/en-US/images/icon.png fdroid/icon.png

      # The index is signed with the same key as the APKs, so the repository's
      # fingerprint is the APKs' certificate fingerprint.
      - name: Restore signing key and check the APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'northvane' }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD are needed (see docs/RELEASING.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          FP=$(keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          # The repository's fingerprint is fixed: users entered it when adding the repository.
          EXPECTED=$(tr -d ' \n' < .github/release-certificate.sha256)
          if [ "$FP" != "$EXPECTED" ]; then
            echo "::error::The signing key isn't the release key ($EXPECTED)"
            exit 1
          fi
          echo "Repository fingerprint: ${FP^^}"
          for apk in fdroid/repo/*.apk; do
            if ! apksigner verify --print-certs "$apk" | grep -q "SHA-256 digest: $FP"; then
              echo "::error::$apk isn't signed with the release key"
              exit 1
            fi
          done
          {
            echo "repo_url: ${PAGES_URL%/}/repo"
            echo "keystore: $RUNNER_TEMP/release.jks"
            echo "repo_keyalias: '$KEY_ALIAS'"
          } >> fdroid/config.yml
          chmod 600 fdroid/config.yml

      - name: Build and sign the repository
        working-directory: fdroid
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          fdroid update --rename-apks --pretty
          mkdir -p ../site
          cp -r repo ../site/
          # The site root sends visitors to the repository page (QR code and "add" link).
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>SuperAwesomeMagicalWeather F-Droid repository</title>' \
            '<meta http-equiv="refresh" content="0; url=repo/"><a href="repo/">F-Droid repository</a>' > ../site/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}repo/
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
